name: Docora Platform CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Build (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run Go Unit & Integration Tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out ./tests/...

      - name: Build Go API Server
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags="-s -w" -o api ./cmd/api

  frontend-build:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run TypeScript Verification
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build
