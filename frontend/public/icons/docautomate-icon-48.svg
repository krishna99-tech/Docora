<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="48" height="48" fill="none">
  <defs>
    <!-- Document Main Body Gradient -->
    <linearGradient id="idocGrad" x1="10%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="30%" stop-color="#0080FF" />
      <stop offset="70%" stop-color="#00A6FF" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>

    <!-- Top-Right Fold Crease Shadow -->
    <linearGradient id="ifoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00359E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#002166" stop-opacity="0" />
    </linearGradient>

    <!-- Top-Right Fold Flap Gradient -->
    <linearGradient id="ifoldFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom Left Curl Gradient -->
    <linearGradient id="icurlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004AD9" />
      <stop offset="100%" stop-color="#002E94" />
    </linearGradient>

    <!-- 8-Tooth Gear Gradient -->
    <linearGradient id="igearGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Automate Text Gradient -->
    <linearGradient id="iautomateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Floating Pixels Gradients -->
    <linearGradient id="ipx1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ipx2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" /><stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <linearGradient id="ipx3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" /><stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ipx4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="ipx5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" /><stop offset="100%" stop-color="#003CB8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="idocShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0040C1" flood-opacity="0.22" />
    </filter>
    <filter id="igearShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="5" stdDeviation="7" flood-color="#0A1847" flood-opacity="0.32" />
    </filter>

    <!-- Center Hole Mask for Gear -->
    <mask id="igearMask_48" maskUnits="userSpaceOnUse" x="200" y="160" width="300" height="300">
      <rect x="200" y="160" width="300" height="300" fill="#FFFFFF" />
      <circle cx="366" cy="326" r="28" fill="#000000" />
    </mask>
  </defs>
  <!-- Document Sheet -->
  <g filter="url(#idocShadow)">
    <path d="
      M 190 74
      L 334 74
      L 404 144
      L 404 354
      A 26 26 0 0 1 378 380
      L 194 380
      A 26 26 0 0 1 168 354
      L 168 96
      A 22 22 0 0 1 190 74
      Z
    " fill="url(#idocGrad)" />

    <!-- Top-Right Fold Crease Shadow -->
    <path d="M 334 74 L 334 144 L 404 144 Z" fill="url(#ifoldShadow)" />

    <!-- Top-Right Fold Flap -->
    <path d="
      M 334 74
      C 334 116 362 144 404 144
      L 334 144
      Z
    " fill="url(#ifoldFlap)" />

    <!-- Bottom Left Inward Curl Accent -->
    <path d="
      M 168 286
      C 168 348 202 380 236 380
      L 194 380
      A 26 26 0 0 1 168 354
      Z
    " fill="url(#icurlGrad)" opacity="0.9" />
  </g>

  <!-- Horizontal Document Lines (Pills) -->
  <rect x="206" y="142" width="94" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92" />
  <rect x="206" y="180" width="148" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92" />
  <rect x="206" y="218" width="90" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92" />

  <!-- Floating Digital Pixel Blocks -->
  <rect x="136" y="134" width="36" height="36" rx="7" fill="url(#ipx1)" />
  <rect x="92" y="166" width="26" height="26" rx="6" fill="url(#ipx2)" />
  <rect x="124" y="198" width="38" height="38" rx="7" fill="url(#ipx3)" />
  <rect x="92" y="246" width="26" height="26" rx="6" fill="url(#ipx4)" />
  <rect x="156" y="254" width="28" height="28" rx="6" fill="url(#ipx5)" />

  <!-- 8-Tooth Mechanical Gear -->
  <g filter="url(#igearShadow)">
    <g mask="url(#igearMask_48)" fill="url(#igearGrad)">
      <rect x="352" y="242" width="28" height="168" rx="7" />
      <rect x="352" y="242" width="28" height="168" rx="7" transform="rotate(45 366 326)" />
      <rect x="352" y="242" width="28" height="168" rx="7" transform="rotate(90 366 326)" />
      <rect x="352" y="242" width="28" height="168" rx="7" transform="rotate(135 366 326)" />
      <circle cx="366" cy="326" r="62" />
    </g>
    <circle cx="366" cy="326" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  </g>
</svg>