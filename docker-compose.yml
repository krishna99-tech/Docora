services:
  postgres:
    image: postgres:16-alpine
    container_name: docora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docora_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-docora_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docora_user} -d ${POSTGRES_DB:-docora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - docora_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docora_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8087}:8087"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8087
      DATABASE_URL: postgres://${POSTGRES_USER:-docora_user}:${POSTGRES_PASSWORD:-docora_secure_password_123}@postgres:5432/${POSTGRES_DB:-docora_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_docora_receipt_platform_min_32_chars!}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-168h}
      DOCUMENT_STORAGE_DRIVER: local
      DOCUMENT_STORAGE_PATH: /app/storage
      PDF_RENDERER: chromedp
      CHROME_BIN: /usr/bin/chromium-browser
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3005}
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8087/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docora_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docora_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    networks:
      - docora_network

  nginx:
    image: nginx:alpine
    container_name: docora_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - docora_network

networks:
  docora_network:
    driver: bridge

volumes:
  postgres_data:
    name: docora_postgres_data
  storage_data:
    name: docora_storage_data
